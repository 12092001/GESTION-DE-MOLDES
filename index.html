<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<title>Vida Útil de Moldes</title>
<style>
:root{
  --bg:#eef2f7; --bg2:#e3e9f1; --card:#ffffff; --ink:#132033; --ink2:#4a5a70; --faint:#8593a6; --line:#d8e0ea; --line2:#c5d0dd;
  --brand:#1d5fd0; --brand2:#e8f0ff; --brandInk:#ffffff; --head:#0f1b2d; --headInk:#ffffff;
  --ok:#1f9d55; --okBg:#e3f6ea; --prec:#e8890c; --precBg:#fff1dc; --crit:#e03b2f; --critBg:#fde6e3; --venc:#7a1fa2; --vencBg:#f3e3fa; --chg:#7cc142; --chgBg:#e4f5d5;
  --shadow:0 1px 2px rgba(16,32,60,.06),0 4px 14px rgba(16,32,60,.06); --r:14px;
  --m1:#1d5fd0; --m2:#e8890c; --m3:#1f9d55; --m4:#7a1fa2; --m5:#d23f7a; --m6:#0e9aa7; --m7:#8a6d3b;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --bg2:#111a2b; --card:#152033; --ink:#e8eef7; --ink2:#a9b7ca; --faint:#71819a; --line:#24324a; --line2:#2f405c;
  --brand:#4d8dff; --brand2:#1b2b48; --head:#0a1322; --okBg:#123524; --precBg:#3a2a10; --critBg:#3d1716; --vencBg:#2f1840; --chgBg:#1f3417;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0b1220; --bg2:#111a2b; --card:#152033; --ink:#e8eef7; --ink2:#a9b7ca; --faint:#71819a; --line:#24324a; --line2:#2f405c;
  --brand:#4d8dff; --brand2:#1b2b48; --head:#0a1322; --okBg:#123524; --precBg:#3a2a10; --critBg:#3d1716; --vencBg:#2f1840; --chgBg:#1f3417;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
@media (min-width:900px){body{padding-bottom:30px}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
/* encabezado */
header.top{position:sticky;top:0;z-index:30;background:var(--head);color:var(--headInk);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#3d82ff,#7cc142);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.ttl{min-width:0;flex:1}
.ttl b{display:block;font-size:16px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;color:#9fb3cf;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:#b9c7da;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#7cc142;display:inline-block}
.sync.pend i{background:#ffb648;animation:pul 1s infinite}.sync.off i{background:#8a97aa}.sync.err i{background:#ff6b5e}.sync.local i{background:#6aa8ff}
@keyframes pul{50%{opacity:.35}}
.hbtn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);display:grid;place-items:center;color:#fff;flex:none}
.hbtn svg{width:20px;height:20px}
@media (max-width:560px){.sync span{display:none}}
/* pestañas */
nav.tabs{display:flex;gap:6px;padding:12px 16px 0;max-width:1280px;margin:0 auto}
nav.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:10px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:8px}
nav.tabs button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
nav.tabs svg{width:18px;height:18px}
@media (max-width:899px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:0;justify-content:space-around;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  nav.tabs button{flex:1;flex-direction:column;gap:3px;font-size:10.5px;padding:6px 1px;border-radius:10px;min-width:0}
  nav.tabs button.on{box-shadow:none;background:var(--brand2)}
  nav.tabs svg{width:22px;height:22px}
}
main{max-width:1280px;margin:0 auto;padding:14px 16px 20px}
h2.sec{font-size:20px;margin:6px 0 2px}
p.lead{margin:0 0 14px;color:var(--ink2);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 4px;font-size:15px}
.card .sub{color:var(--faint);font-size:12.5px;margin:0 0 10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden;text-align:left}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--brand))}
.kpi b{display:block;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--ink2);font-size:12.5px}
.kpi small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px}
button.kpi{border:1px solid var(--line);width:100%}
/* controles */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink2);display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.in,select.in{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:9px 11px;min-height:40px;width:100%}
.in:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.bar .in{width:auto;flex:1;min-width:140px}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brandInk)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.danger.full{background:var(--crit);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* estado */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;background:var(--bgc);color:var(--fc);white-space:nowrap}
.e-ok{--bgc:var(--okBg);--fc:var(--ok);--c:var(--ok)}.e-precaucion{--bgc:var(--precBg);--fc:var(--prec);--c:var(--prec)}
.e-critica{--bgc:var(--critBg);--fc:var(--crit);--c:var(--crit)}.e-vencida{--bgc:var(--vencBg);--fc:var(--venc);--c:var(--venc)}
/* tarjetas de bancas */
.bancas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.bk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 14px;text-align:left;width:100%;position:relative;overflow:hidden}
.bk:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
.prk{position:absolute;right:10px;top:-1px;background:var(--c);color:#fff;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:0 0 7px 7px}
.bk .vac{margin-top:6px}
.bk .r1{display:flex;align-items:center;gap:10px}
.bk .num{width:46px;height:46px;border-radius:12px;background:var(--bgc);color:var(--fc);display:grid;place-items:center;font-weight:800;font-size:19px;flex:none;line-height:1}
.bk .num small{display:block;font-size:9px;font-weight:700;opacity:.8;text-align:center}
.bk .nm{min-width:0;flex:1}
.bk .nm b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .nm span{color:var(--faint);font-size:12px}
.bk .vac{text-align:right}
.bk .vac b{font-size:22px;font-variant-numeric:tabular-nums}
.bk .vac span{color:var(--faint);font-size:12px}
.prog{height:9px;background:var(--bg2);border-radius:99px;margin:11px 0 9px;position:relative;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--c)}
.prog em{position:absolute;top:0;bottom:0;width:2px;background:var(--card);opacity:.9}
.bk .r3{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink2)}
.bk .r3 b{color:var(--ink)}
.bk .chg{margin-top:8px;font-size:12px;display:flex;align-items:center;gap:6px;color:var(--ink2)}
.tag{border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700;background:var(--chgBg);color:#3f7d17}
.tag.sug{background:var(--brand2);color:var(--brand)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:#a6e07a}}
/* calendario */
.calwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);max-height:70vh;box-shadow:var(--shadow)}
table.cal{border-collapse:separate;border-spacing:0;font-size:12px;font-variant-numeric:tabular-nums}
table.cal th,table.cal td{padding:0;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
table.cal thead th{position:sticky;top:0;background:var(--card);z-index:2;font-weight:600;color:var(--ink2);padding:4px 0;min-width:32px}
table.cal thead th.wk{background:var(--bg2)}
table.cal thead th.td{background:var(--brand);color:#fff}
table.cal thead th small{display:block;font-size:10px;font-weight:500;opacity:.8}
table.cal .fix{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;padding:4px 8px;min-width:96px;max-width:120px;overflow:hidden;text-overflow:ellipsis}
table.cal thead .fix{z-index:3}
table.cal td.c{height:30px;min-width:32px;font-weight:600}
td.c.ok{background:var(--okBg);color:var(--ok)}td.c.precaucion{background:var(--precBg);color:var(--prec)}td.c.critica{background:var(--critBg);color:var(--crit)}td.c.vencida{background:var(--venc);color:#fff}
td.c.cg{background:var(--chg);color:#fff;font-weight:800;cursor:pointer}td.c.cg.sug{background:repeating-linear-gradient(45deg,var(--chg),var(--chg) 5px,#93d35d 5px,#93d35d 10px)}
td.c.td{box-shadow:inset 2px 0 0 var(--brand),inset -2px 0 0 var(--brand)}
td.c.na{background:transparent;color:var(--faint)}
.fix b{font-size:13px}.fix small{display:block;color:var(--faint);font-size:10.5px;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin:10px 0}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;background:var(--c);display:inline-block}
/* listas */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .dt{width:52px;text-align:center;flex:none;border-radius:10px;background:var(--bg2);padding:5px 0;line-height:1.1}
.li .dt b{display:block;font-size:18px}.li .dt small{font-size:11px;color:var(--ink2);text-transform:uppercase}
.li .tx{flex:1;min-width:0}.li .tx b{display:block;font-size:14px}.li .tx span{color:var(--ink2);font-size:12.5px}
.li .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--bg2)}
.li .ic svg{width:18px;height:18px}
.empty{text-align:center;color:var(--ink2);padding:30px 16px}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}
/* tablas */
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{text-align:left;color:var(--faint);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
table.tb td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbw{overflow-x:auto}
/* gráficas */
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch text{fill:var(--ink2);font-size:11px;font-family:inherit}
svg.ch .gl{stroke:var(--line);stroke-width:1}
.chleg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2);margin-top:8px}
.chleg span{display:flex;align-items:center;gap:5px}.chleg i{width:11px;height:11px;border-radius:3px;background:var(--c)}.invg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ivc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;border-top:4px solid var(--c)}
.ivh{display:flex;align-items:center;gap:8px}.ivh b{flex:1;font-size:15px}.ivh .dot{width:12px;height:12px;border-radius:4px;flex:none}
.ivn{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}.ivn small{display:block;color:var(--ink2);font-size:11.5px}.ivn b{font-size:24px;font-variant-numeric:tabular-nums}
.ivt{margin:4px 0 0;font-size:12.5px;color:var(--ink2)}
.top5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:4px 0 12px}
@media (max-width:700px){.top5{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:150px;overflow-x:auto;padding-bottom:4px}}
.t5{border:1px solid var(--line);border-top:4px solid var(--c);background:var(--card);border-radius:12px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:1px;position:relative;min-width:0}
.t5 .rk{position:absolute;right:8px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center}
.t5 b{font-size:18px}.t5 small{color:var(--ink2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t5 em{font-style:normal;font-weight:700;color:var(--fc);font-size:12.5px}
.tip{position:fixed;z-index:80;background:var(--head);color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;pointer-events:none;max-width:240px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
/* modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(8,14,26,.55);display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
@media (min-width:700px){.ov{align-items:center;padding:24px}}
@keyframes fi{from{opacity:0}}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:su .2s}
@media (min-width:700px){.sheet{border-radius:20px}}
.sheet.sm{max-width:480px}
@keyframes su{from{transform:translateY(30px);opacity:.4}}
.sh{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.sh h3{margin:0;font-size:19px}.sh p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.x{margin-left:auto;width:38px;height:38px;border-radius:50%;border:0;background:var(--bg2);font-size:20px;line-height:1;flex:none}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:12px 0 5px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.acts .grow{flex:1}
.note{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--brand2);color:var(--ink);margin:10px 0}
.note.bad{background:var(--critBg);color:var(--crit)}.note.ok{background:var(--okBg);color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:6px 0 14px}
.st{background:var(--bg2);border-radius:12px;padding:10px 12px}
.st span{display:block;color:var(--ink2);font-size:12px}.st b{font-size:20px;font-variant-numeric:tabular-nums}.st small{color:var(--faint);font-size:11.5px;display:block}
.tbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:14px 0}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--head);color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:92vw;text-align:center;animation:su .2s}
@media (min-width:900px){.toast{bottom:28px}}
/* acceso */
.login{position:fixed;inset:0;z-index:70;background:radial-gradient(1200px 600px at 20% -10%,#24477e,transparent),linear-gradient(160deg,#0f1b2d,#0a1322);display:grid;place-items:center;padding:20px;overflow:auto}
.lbox{width:100%;max-width:380px;background:var(--card);border-radius:20px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.lbox .logo{width:52px;height:52px;border-radius:15px;margin-bottom:12px}.lbox .logo svg{width:30px;height:30px}
.lbox h1{font-size:21px;margin:0}.lbox p{color:var(--ink2);font-size:13.5px;margin:4px 0 8px}
.lnk{border:0;background:none;color:var(--brand);font-weight:600;padding:6px 0;text-decoration:underline}
.chkl{display:flex;gap:9px;align-items:flex-start;margin:14px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.4}.chkl input{width:20px;height:20px;flex:none;margin:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.pill{display:inline-block;background:var(--bg2);border-radius:6px;padding:1px 6px;font-size:12px;font-weight:600}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#7cc142;animation:rot 1s linear infinite;margin:0 auto 12px}
@keyframes rot{to{transform:rotate(360deg)}}
@media print{header.top,nav.tabs,.bar,.acts,.btn{display:none!important}body{background:#fff;padding:0}.card,.kpi{box-shadow:none}}
</style>
</head>
<body>
<header class="top">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.5"/><path d="M6 10v8M18 10v8M9 14h6M4 20h16"/></svg></div>

/* Plan de cambios: respeta las fechas programadas y sugiere las demás

  if(e.target.id === "hbanca"){ S.h.banca = e.target.value; render(); }
});
$("#btnCfg").addEventListener("click", hojaAjustes);
(function(){ var t = LS.get("mv_tema", ""); if(t) document.documentElement.setAttribute("data-theme", t); })();
// refresca a medianoche y cada 10 minutos para que los conteos avancen solos
setInterval(function(){ if(DB && !$("#ov")) render(); }, 600000);
var anchoPrev = innerWidth; addEventListener("resize", function(){ if((innerWidth < 600) !== (anchoPrev < 600)){ anchoPrev = innerWidth; if(DB){ render(); if(S.abierta && $("#ov .stats")) abrirBanca(S.abierta); } } });

/* ============================================================
   ARRANQUE: nube (Firebase) o local
   ============================================================ */
var fb = null;
function conectar(store){
  DB = store; S.modo = store.tipo; syncUI();
  DB.listen("config", function(o){ S.cfg = Object.assign(limpio(CFG0), o.general || {}); memoDias = {}; S.listo.config = true; render(); if(S.abierta && $("#ov .stats")) abrirBanca(S.abierta); });
  DB.listen("bancas", function(o){ S.bancas = o; S.listo.bancas = true; render(); if(S.abierta && $("#ov .stats")) abrirBanca(S.abierta); });
  DB.listen("inventario", function(o){ S.inv = o; if(S.tab === "inventario") render(); });
  DB.listen("eventos", function(o){ S.eventos = o; S.listo.eventos = true; if(S.tab === "historial" || S.tab === "tablero") render(); });
  $("#login").classList.add("hidden");
}
function modoLocal(){ LS.set("mv_modo", "local"); S.nombre = "Este dispositivo"; conectar(almacenLocal()); }
function pantallaLogin(msg){
  $("#login").classList.remove("hidden");
  $("#lbox").innerHTML = '<div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.5"/><path d="M6 10v8M18 10v8M9 14h6M4 20h16"/></svg></div><h1>Vida Útil de Moldes</h1><p>Entra con tu usuario para ver y actualizar las bancas en tiempo real.</p>' +
    (msg ? '<div class="note bad">' + esc(msg) + '</div>' : '') +
    (fb ? '<form id="lf"><label class="f">Usuario</label><input class="in" id="lu" autocomplete="username" autocapitalize="none" placeholder="ej. ignacio" required><label class="f">Contraseña</label><input class="in" id="lp" type="password" autocomplete="current-password" required><div class="acts"><button class="btn pri grow" type="submit" id="lb">Entrar</button></div></form>'
      : '<div class="note">No se pudo conectar con la nube (sin internet o el archivo se abrió sin conexión).</div><div class="acts"><button class="btn pri grow" id="reint">Reintentar</button></div>') +
    '<p style="margin-top:14px;font-size:12.5px">¿Sin usuario o sin internet? <button class="lnk" id="loc">Usar solo en este dispositivo</button></p>';
  var lf = $("#lf"); if(lf) lf.addEventListener("submit", function(e){ e.preventDefault(); var u = $("#lu").value.trim().toLowerCase(), p = $("#lp").value, b = $("#lb"); if(!u || !p) return; b.disabled = true; b.textContent = "Entrando…";
    fb.auth.signInWithEmailAndPassword(u.indexOf("@") >= 0 ? u : u + "@" + DOMINIO, p).catch(function(er){ b.disabled = false; b.textContent = "Entrar"; var c = er && er.code || "";
      pantallaLogin(/invalid|wrong|not-found|user/.test(c) ? "Usuario o contraseña incorrectos." : /too-many/.test(c) ? "Demasiados intentos. Espera unos minutos." : /network/.test(c) ? "Sin conexión a internet." : "No se pudo entrar (" + c + ")."); $("#lu").value = u; }); });
  var r = $("#reint"); if(r) r.onclick = function(){ location.reload(); };
  $("#loc").onclick = modoLocal;
}
function cargarScript(src){ return new Promise(function(ok, bad){ var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }
function iniciar(){
  if(LS.get("mv_modo", "") === "local"){ modoLocal(); return; }
  var base = "https://www.gstatic.com/firebasejs/" + FBV + "/", hecho = false;
  var tmo = setTimeout(function(){ if(!hecho){ hecho = true; pantallaLogin(); } }, 9000);
  cargarScript(base + "firebase-app-compat.js").then(function(){ return Promise.all([cargarScript(base + "firebase-auth-compat.js"), cargarScript(base + "firebase-firestore-compat.js")]); }).then(function(){
    if(hecho) return; hecho = true; clearTimeout(tmo);
    if(!firebase.apps.length) firebase.initializeApp(FB_CFG);
    fb = {auth:firebase.auth(), db:firebase.firestore()};
    try{ fb.db.enablePersistence({synchronizeTabs:true}).catch(function(){}); }catch(e){}
    var conectado = false;
    fb.auth.onAuthStateChanged(function(u){
      if(u){ S.user = u; S.nombre = (u.email || "").split("@")[0]; if(!conectado){ conectado = true; conectar(almacenNube(fb.db)); } }
      else { if(conectado){ location.reload(); return; } pantallaLogin(); }
    });
  }, function(){ if(hecho) return; hecho = true; clearTimeout(tmo); pantallaLogin(); });
}
window.MOLDES = {S:S, calcularPlan:calcularPlan, vacHoy:vacHoy, vence:vence, abrirBanca:abrirBanca, render:renderYa};
iniciar();
})();
</script>
